# Builds the LGPL embedded FFmpeg for every platform and checks each build on its own system (check.sh).
# Runs only when started by hand (Actions | Embedded FFmpeg | Run workflow). Started on a tag ffmpeg-<build-id>, it
# also publishes a prerelease: the ZIPs, their checksums, ffmpeg-manifest.json and the Corresponding Source. The
# plugin's repository runs its full test suite against that prerelease before it takes the manifest; then the
# release is marked final (gh release edit ffmpeg-<build-id> --prerelease=false --latest).

name: Embedded FFmpeg
on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-24.04, docker: linux }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, docker: linux }
          - { platform: windows-x64, runner: ubuntu-24.04, docker: windows }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: .ffbuild/cache
          key: ffmpeg-src-${{ hashFiles('versions.env') }}

      # macOS runners have no autoconf; build.sh builds its pinned automake and nasm itself.
      - name: Tools (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install autoconf libtool

      - name: Build natively
        if: ${{ !matrix.docker }}
        run: ./build.sh ${{ matrix.platform }} dist

      - name: Build in container
        if: ${{ matrix.docker }}
        run: |
          docker build -f ${{ matrix.docker }}.Dockerfile -t mmx-ffmpeg .
          docker run --rm -v "$PWD:/src" -w /src mmx-ffmpeg ./build.sh ${{ matrix.platform }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: dist/*

  check:
    name: Check on ${{ matrix.platform }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: dist
      - name: Check
        run: |
          cd dist && unzip -q ffmpeg-*.zip
          ../check.sh "$(ls -d "$PWD"/ffmpeg-*/)"

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/ffmpeg-')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: ffmpeg-*
          path: dist
          merge-multiple: true
      # LGPL-3.0 makes us keep the Corresponding Source available, not just link to upstream: it goes into the release.
      - name: Corresponding Source
        run: ./sources.sh sources
      - name: Release and manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          python3 make_manifest.py dist "https://github.com/${{ github.repository }}/releases/download/$tag" > dist/ffmpeg-manifest.json
          gh release create "$tag" --prerelease --title "Embedded FFmpeg ${tag#ffmpeg-}" \
            --notes "LGPL-3.0 FFmpeg builds for the Multimedia plugin for JetBrains IDEs. The source archives of FFmpeg and every linked library, and the build scripts, are attached (see ffmpeg-*-sources.txt); configure lines are in BUILDINFO.txt inside every archive." \
            dist/*.zip dist/*.sha256 dist/ffmpeg-manifest.json sources/*
